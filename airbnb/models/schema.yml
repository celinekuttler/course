models:
  - name: dim_listings_cleansed
    data_tests:
      - minimum_row_count:
          arguments:
            min_row_count: 1000
    columns:
      - name: listing_id
        tests:
          - unique
          - not_null
      - name: host_id
        data_tests:
          - not_null
          - relationships:
              arguments: 
                to: ref('dim_hosts_cleansed')
                field: host_id

      - name: minimum_nights
        data_tests:
          - positive_values
      - name: room_type
        data_tests:
          - accepted_values:
              arguments:
                values: ['Entire home/apt',
                'Private room',
                'Shared room',
                'Hotel room']

  - name: dim_hosts_cleansed
    columns:
      - name: host_id
        data_tests:
          - unique 
          - not_null
      - name: host_name 
        data_tests:
          - not_null
      - name: is_superhost
        data_tests:
          - accepted_values:
              arguments:
                values: ['t','f']
  - name: fct_reviews
    columns:
        - name: listing_id
          data_tests:
            - relationships:
                arguments:
                  to: ref('dim_listings_cleansed')
                  field: listing_id
        - name: reviewer_name
          data_tests:
            - not_null
        - name: review_text
          data_tests:
              - not_null
        - name: sentiment
          data_tests:
            - not_null
            - accepted_values:
                arguments:
                values: ['positive','neutral','negative']
        - name: review_date
          data_tests:
            - not_null

