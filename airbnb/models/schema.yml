models:
  - name: dim_listings_cleansed
    description: cleansed listing table for airbnb project
    data_tests:
      - minimum_row_count:
          arguments:
            min_row_count: 1000
    columns:
      - name: listing_id
        description: primary key for the listing
        tests:
          - unique
          - not_null
      - name: host_id
        description: references the host
        data_tests:
          - not_null
          - relationships:
              arguments: 
                to: ref('dim_hosts_cleansed')
                field: host_id

      - name: minimum_nights
        description: '{{ doc("dim_listings_cleansed__minimum_nights")  }}'
        data_tests:
          - positive_values

      - name: room_type
        data_tests:
          - accepted_values:
              arguments:
                values: ['Entire home/apt','Private room','Shared room','Hotel room']

  - name: dim_hosts_cleansed
    description: cleaned hosts table for the airbnb model
    columns:
      - name: host_id
        description: primary key of host table
        data_tests:
          - unique 
          - not_null
      - name: host_name 
        description: name of a host 
        data_tests:
          - not_null
      - name: is_superhost
        description: indicates superhosts (true or false, indicated by 't' or 'f')
        data_tests:
          - accepted_values:
              arguments:
                values: ['t','f']

  - name: fct_reviews
    columns:
        - name: listing_id
          data_tests:
            - relationships:
                arguments:
                  to: ref('dim_listings_cleansed')
                  field: listing_id
        - name: reviewer_name
          data_tests:
            - not_null
        - name: review_text
          data_tests:
              - not_null
        - name: sentiment
          data_tests:
            - not_null
            - accepted_values:
                arguments:
                  values: ['positive','neutral','negative']
        - name: review_date
          data_tests:
            - not_null

